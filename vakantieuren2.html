<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vakantie-uren berekenen</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px 16px;
      display: grid;
      place-items: center;
      background: #f1f5f9;
      color: #172033;
      font-family: Arial, sans-serif;
    }

    .kaart {
      width: min(100%, 540px);
      padding: 30px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 12px 35px #1928411f;
    }

    h1 { margin: 0 0 8px; font-size: 25px; }

    .intro {
      margin: 0 0 22px;
      color: #64748b;
      line-height: 1.5;
    }

    .veld { margin-bottom: 17px; }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: 600;
    }

    .tijdvelden {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .tijdvelden input,
    input,
    select {
      width: 100%;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 9px;
      background: white;
      font-size: 16px;
    }

    input:focus, select:focus {
      outline: 3px solid #bfdbfe;
      border-color: #3b82f6;
    }

    .hint {
      margin: 5px 0 0;
      color: #64748b;
      font-size: 12px;
    }

    button {
      width: 100%;
      padding: 13px;
      border: 0;
      border-radius: 9px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover { background: #1d4ed8; }

    .resultaat {
      display: none;
      margin-top: 20px;
      padding: 18px;
      border-radius: 12px;
      background: #eff6ff;
      text-align: center;
    }

    .resultaat.negatief { background: #fff7ed; }

    .getal {
      color: #1d4ed8;
      font-size: 30px;
      font-weight: 700;
    }

    .resultaat.negatief .getal { color: #c2410c; }

    .uitleg {
      margin: 10px 0 0;
      color: #475569;
      font-size: 14px;
      line-height: 1.5;
    }

    .fout {
      display: none;
      margin: 12px 0 0;
      color: #b91c1c;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <main class="kaart">
    <h1>Vakantie-uren berekenen</h1>
    <p class="intro">
      Vul uren en minuten in. De resterende uren worden automatisch berekend.
    </p>

    <form id="formulier">
      <div class="veld">
        <label for="maanden">Hoeveel maanden heeft de werknemer gewerkt?</label>
        <input id="maanden" type="number" min="0" max="12" step="0.1"
               placeholder="Bijvoorbeeld: 8" required>
      </div>

      <div class="veld">
        <label for="eindmaand">In welke maand stopt het contract?</label>
        <select id="eindmaand" required>
          <option value="">Kies een maand</option>
          <option>Januari</option><option>Februari</option>
          <option>Maart</option><option>April</option>
          <option>Mei</option><option>Juni</option>
          <option>Juli</option><option>Augustus</option>
          <option>September</option><option>Oktober</option>
          <option>November</option><option>December</option>
        </select>
      </div>

      <div class="veld">
        <label>Vakantie-uren voor een heel jaar</label>
        <div class="tijdvelden">
          <input id="jaarUren" type="number" min="0" placeholder="Uren" required>
          <input id="jaarMinuten" type="number" min="0" max="59"
                 placeholder="Minuten" value="0" required>
        </div>
      </div>

      <div class="veld">
        <label>Dit jaar al opgenomen</label>
        <div class="tijdvelden">
          <input id="opgenomenUren" type="number" min="0"
                 placeholder="Uren" value="0" required>
          <input id="opgenomenMinuten" type="number" min="0" max="59"
                 placeholder="Minuten" value="0" required>
        </div>
      </div>

      <div class="veld">
        <label>Overgebleven van vorig jaar</label>
        <div class="tijdvelden">
          <input id="vorigJaarUren" type="number" min="0"
                 placeholder="Uren" value="0" required>
          <input id="vorigJaarMinuten" type="number" min="0" max="59"
                 placeholder="Minuten" value="0" required>
        </div>
        <p class="hint">Minuten moeten tussen 0 en 59 liggen.</p>
      </div>

      <button type="submit">Bereken resterende uren</button>
      <p id="fout" class="fout"></p>
    </form>

    <section id="resultaat" class="resultaat" aria-live="polite">
      <div>Resterende vakantie-uren</div>
      <div id="getal" class="getal"></div>
      <p id="uitleg" class="uitleg"></p>
    </section>
  </main>

  <script>
    const formulier = document.getElementById("formulier");
    const resultaat = document.getElementById("resultaat");
    const getal = document.getElementById("getal");
    const uitleg = document.getElementById("uitleg");
    const fout = document.getElementById("fout");

    function minutenTotaal(urenId, minutenId) {
      const uren = Number(document.getElementById(urenId).value);
      const minuten = Number(document.getElementById(minutenId).value);

      if (uren < 0 || minuten < 0 || minuten > 59) {
        throw new Error("Uren mogen niet negatief zijn en minuten moeten tussen 0 en 59 liggen.");
      }

      return uren * 60 + minuten;
    }

    function toonTijd(totaalMinuten) {
      const teken = totaalMinuten < 0 ? "−" : "";
      const absoluut = Math.abs(Math.round(totaalMinuten));
      const uren = Math.floor(absoluut / 60);
      const minuten = absoluut % 60;

      return `${teken}${uren} uur en ${minuten} minuten`;
    }

    formulier.addEventListener("submit", function (event) {
      event.preventDefault();

      try {
        const maanden = Number(document.getElementById("maanden").value);

        if (maanden < 0 || maanden > 12) {
          throw new Error("Gewerkte maanden moeten tussen 0 en 12 liggen.");
        }

        const jaarMinuten = minutenTotaal("jaarUren", "jaarMinuten");
        const opgenomenMinuten =
          minutenTotaal("opgenomenUren", "opgenomenMinuten");
        const vorigJaarMinuten =
          minutenTotaal("vorigJaarUren", "vorigJaarMinuten");

        const opgebouwdDitJaar = jaarMinuten * maanden / 12;
        const resterend =
          opgebouwdDitJaar - opgenomenMinuten + vorigJaarMinuten;

        getal.textContent = toonTijd(resterend);
        uitleg.textContent =
          `Dit jaar opgebouwd: ${toonTijd(opgebouwdDitJaar)}. ` +
          `Opgenomen: ${toonTijd(opgenomenMinuten)}. ` +
          `Meegenomen van vorig jaar: ${toonTijd(vorigJaarMinuten)}. ` +
          `Contracteinde: ${document.getElementById("eindmaand").value}.`;

        resultaat.style.display = "block";
        resultaat.classList.toggle("negatief", resterend < 0);
        fout.style.display = "none";
      } catch (error) {
        fout.textContent = error.message;
        fout.style.display = "block";
        resultaat.style.display = "none";
      }
    });
  </script>
</body>
</html>
